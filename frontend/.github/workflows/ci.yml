name: CI 

on: 
  push: 
  branches:
    - main
  pull_request: 
    branches: 
    - main

permissions:
  contents: read 

jobs: 
  verify: 
    name: Verify Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Verify Application
        run: npm run verify